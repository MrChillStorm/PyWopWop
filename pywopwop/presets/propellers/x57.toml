# NASA's X-57 Maxwell (Mod III and IV), from its OpenVSP model (X-57.vsp3, NASA-3D-Resources), by the FlightGear X-57 model's
# fdm/geometry.py: the cruise propellers at the wingtips (Mod III and IV) and twelve high-lift propellers ahead of the wing
# (Mod IV). Stations: inches, x aft, y right, z up. Mods II to IV never flew, so nothing here was heard in flight.
[aircraft]
name = "X-57"
description = "Battery-electric demonstrator: two wingtip cruise propellers and twelve folding high-lift propellers"
mass_kg = 1360.0                # 3000 lb
origin_in = [154.797, 0.0, 64.527]      # the moment reference: stations to the aircraft frame
cockpit_in = [125.0, -14.0, 78.0]       # the left seat's head: estimated on the P2006T's cabin under the wing's leading edge

# Wing: [y, leading edge x, chord, chord line z, half thickness], stations in inches
wing_in = [[0.0, 144.9, 29.76, 87.5, 2.0], [189.7, 148.0, 20.83, 87.5, 1.4]]

[cruise]                        # MT-Propeller MTV-7-152/64, electric variable pitch 14 to 40 deg at 0.75 R
radius = 0.7620
blades = 3
root_cutout = 0.25
chord = [[0.1000, 0.0668], [0.1671, 0.0668], [0.2495, 0.0799], [0.3318, 0.0922], [0.4142, 0.1031], [0.4966, 0.1107], [0.5790, 0.1150], [0.6613, 0.1153], [0.7437, 0.1110], [0.8261, 0.1038], [0.9084, 0.0936], [1.0000, 0.0803]]
twist = [[0.1000, 78.9502], [0.1671, 69.4702], [0.2495, 58.9244], [0.3318, 53.1356], [0.4142, 47.1146], [0.4966, 42.2951], [0.5790, 38.0689], [0.6613, 34.3019], [0.7437, 31.2046], [0.8261, 28.5290], [0.9084, 26.0695], [1.0000, 24.4051]]
airfoil = { name = "MTV-7 at 0.74 R", table = "mtv7_075", shape = "mtv7_075", te_thickness = 0.004, trip = 1 }
hubs_in = [[138.113, -189.741, 87.649], [138.113, 189.741, 87.649]]
rotation = ["cw", "ccw"]        # seen from ahead, tops turning inboard: against the wingtip vortices
names = ["cruise_left", "cruise_right"]
pitch_stops_deg = [14.0, 40.0]

[high_lift]                     # 5 blades, MH 114, folding, fixed pitch
radius = 0.2880
blades = 5
root_cutout = 0.2024
chord = [[0.2024, 0.0377], [0.2418, 0.0518], [0.3186, 0.0724], [0.4096, 0.0682], [0.5034, 0.0537], [0.5949, 0.0449], [0.6808, 0.0390], [0.7592, 0.0348], [0.8282, 0.0317], [0.8868, 0.0293], [0.9339, 0.0268], [0.9687, 0.0215], [0.9908, 0.0110], [1.0000, 0.0060]]
twist = [[0.2024, 69.8380], [0.2418, 64.6480], [0.3186, 55.2110], [0.4096, 44.7520], [0.5034, 37.4920], [0.5949, 32.6790], [0.6808, 29.3860], [0.7592, 27.1180], [0.8282, 25.6400], [0.8868, 24.8490], [0.9339, 24.7330], [0.9687, 24.6940], [0.9908, 24.8870], [1.0000, 24.9950]]
airfoil = { name = "MH 114", table = "mh114", shape = "mh114", te_thickness = 0.014, trip = 1 }
# 27.35 deg as drawn. Spinning, the blades fold about 10 deg forward on their hinges, which takes 2.5 to 4.5 deg off the pitch
# (NASA's tunnel test); the rest of the offset is fitted to NASA's final tables (ANLYS-CEPT-023, appendices B and C), as
# NASA's own blade element model is
pitch_deg = 20.0
# Stations of discs 7 to 12, inboard to outboard on the right; 1 to 6 outboard to inboard on the left: numbered left tip to
# right tip, 6 and 7 the root pair (the pylons' names; NASA has pallet B's contactor losing the inboard motors). Neighbours
# counter-rotate; which way each turns isn't published, so odd clockwise is an assumption
hubs_in = [[135.826, 34.98, 82.491], [137.807, 57.66, 82.491], [135.827, 80.34, 82.491], [139.295, 103.02, 82.491], [137.316, 125.7, 82.491], [140.808, 148.38, 82.491]]
groups = { hl_a_left = [1, 3, 5], hl_b_left = [2, 4, 6], hl_b_right = [7, 9, 11], hl_a_right = [8, 10, 12] }

# The walls of the P2006T's cabin, estimated: aluminium skin and light trim, big acrylic windows, sealed doors
[cabin]
surface_mass = 4.0
coincidence_hz = 8000.0
loss_factor = 0.05
window_share = 0.3
window_mass = 3.6
window_coincidence_hz = 9000.0
window_loss_factor = 0.05
leak = 1e-3
first_mode_hz = 100.0

# Motors. No measured noise level has turned up for either: level_db is assumed (the sound pressure 1 m away of each motor's
# electromagnetic tones at full torque), and so are the high-lift motor's poles and slots. The cruise motor's are the 2016
# design study's (48 slots, 40 poles: 800 Hz electrical at 2400 rpm); the built motor may differ. The inverters switch near
# 40 kHz, out of hearing. tones: [order of the rotation, dB against level_db, 1 if it follows the torque, 0 if it doesn't]
[motor.cruise]
rpm = 2250.0
level_db = 72.0
tones = [[40.0, 0.0, 1], [120.0, -6.0, 1], [48.0, -8.0, 0], [240.0, -14.0, 1]]

[motor.high_lift]
rpm = 4800.0
level_db = 64.0
tones = [[20.0, 0.0, 1], [60.0, -6.0, 1], [24.0, -8.0, 0], [120.0, -14.0, 1]]

# Measured: the tones NASA's array put on the spinner's fasteners and gap, at 3.65 and 4.375 kHz, 59 and 52 dB in 10 Hz in the
# propeller's plane 3.54 m away at 4800 rpm and 75 KEAS (taken here as orders of the rotation, as a spinner's would be)
[hub.high_lift]
rpm = 4800.0
distance_m = 3.54
tones = [[45.625, 59.0], [54.6875, 52.0]]
