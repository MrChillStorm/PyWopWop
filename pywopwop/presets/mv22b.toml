# Bell Boeing MV-22B Osprey, helicopter mode (nacelles vertical) and airplane mode, from the FlightGear V-22 JSBSim model's data
# (fdm/v22data.py): rotor geometry from Rosenstein and Clark (ERF 1986, paper 14, figs. 4 and 16), Acree (NASA
# TM-2016-219070) and Johnson's TRAM calculations (AHS 2001); the blade's rotating frequencies from the dynamically
# scaled 1/5-scale WRATS model (Ghiringhelli et al., AHS 1999, NTRS 20040086758, tables 1 and 3), which carry over
# per rev; the drag area from the flight model's trims at 90 deg of nacelle.
[aircraft]
name = "MV-22B"
description = "Two three-blade gimballed proprotors side by side, 412 rpm; airplane mode (--nacelle 0) 333.5 rpm"
mass_kg = 21546.0            # 47,500 lb, the flight model's reference loading
# the airframe's drag at 90 deg of nacelle in the flight model's trims at 80, 100 and 120 kt, least squares in the
# dynamic pressure: 110 ft^2. Below 80 kt the model's airframe drag is higher than this (the rotors' wake on the
# wing, skewed back), which one drag area can't hold
drag_area_m2 = 10.2
download = 0.10              # the wing under the rotors, flaperons at 67 deg: 9.2 % of thrust (0.658-scale test, RC fig. 18)
cockpit = [4.28, -0.57, -3.15]   # the right seat's eye, from the FlightGear 3-D model
hub_height_m = 5.20          # hubs above the ground on the gear, nacelles vertical (3-D model)
windscreen_m = 2.1           # the windscreen's centroid from the nose's tip (3-D model: 2.09 m)
# the skin round the cockpit and the cabin open to it, from the 3-D model (x, half-width, floor and roof z, and the
# section's squareness): the cabin's boxy section from its aft end to the cockpit (straight sides to sharp shoulders,
# a superellipse of exponent 8 to its vertices), the nose's rounder taper ahead of it. In airplane mode the
# proprotors' tips pass 0.21 m from its shoulders at x = 2 m, just behind the pilots
# the cockpit's windscreen and side windows on it, from the 3-D model (x from, x to, z from, z to; both sides)
glazing = [[3.5, 5.6, -4.1, -2.56]]
fuselage = [[-4.5, 1.16, -4.79, -2.52, 8.0], [4.0, 1.16, -4.79, -2.51, 8.0], [4.5, 1.13, -4.78, -2.51, 4.0],
            [5.0, 1.06, -4.78, -2.60, 4.0], [5.5, 0.91, -4.70, -3.00, 4.0], [6.0, 0.69, -4.64, -3.30, 4.0],
            [6.5, 0.51, -4.52, -3.65, 4.0]]
# the wing over the fuselage's top, from the 3-D model (|y|, leading edge x, chord, chord line z, half thickness): in
# airplane mode its leading edge 0.3 to 0.6 m behind the discs; the tip circles, seen along the axes, cross it at its
# roots
wing = [[0.0, 2.0, 2.87, -2.32, 0.35], [1.3, 1.85, 2.87, -2.32, 0.35], [6.4, 1.48, 2.87, -2.02, 0.27]]
# airplane mode (nacelles 0, 84 % = 333.5 rpm): the flight model's level trims at 47,500 lb, 1000 ft (true airspeed kt,
# angle of attack deg, each rotor's thrust N); the wing (and fuselage and tail) carry 41,000 lb of it
airplane_rpm = 333.5
airplane_trim_m = 305.0
airplane_trim = [[160, 8.81, 14377], [180, 7.01, 12660], [200, 6.22, 11138], [220, 4.76, 11401], [250, 3.03, 12918],
                 [270, 2.20, 14248]]

# The walls of the cockpit and the cabin open to it (estimated): a trimmed sidewall, the composite skin with its
# frames (about 2 mm of carbon laminate, its frames and stringers as much again: coincidence near 4.5 kHz, damped) and
# a trim panel 75 mm inside it with insulation blankets between (a double wall: its mass-air-mass resonance near 135
# Hz, above it far tighter than one wall; both walls' mass so that the proprotors' lines stand out of the broadband
# from 50 to 200 Hz as they do in the recording); the cockpit's glazing a laminated windscreen and side windows (coincidence near 1.5 kHz, its interlayers
# damping the dip), where the 3-D model has them (glazing); sealed, with leaks at -40 dB; the trimmed cabin's default
# absorption.
[cabin]
surface_mass = 7.0
coincidence_hz = 4500.0
loss_factor = 0.3
trim_mass = 4.0
trim_gap = 0.075
window_share = 0.07
window_mass = 20.0
window_coincidence_hz = 1500.0
window_loss_factor = 0.3
leak = 1e-4
# where the vortices strike the wing it is bolted to the cabin's roof frames, and its loads reach the cabin through
# them (wing.structure_borne): the power they feed in is the structure's input mobility there, measured from the
# recording (so the proprotors' 14th to 30th harmonics stand out of the broadband as they do there, 6 dB): 5.6e-4
# s/kg, 9 dB under the cabin skin's own, about what a wing box's thick skins and spars (a tenth) make of it
wing_mobility = 5.6e-4
# which harmonics land on the cabin's resonances isn't known, so one draw of its modal response: of 64, the one whose
# blade pulsing, band by band, comes nearest the recording's without standing out more than it does
modes_seed = 55

[[rotor]]
name = "right"
role = "main"
radius = 5.804               # 38 ft diameter
blades = 3
rpm = 412.0                  # 104 %, the helicopter and conversion modes' speed (100 % = 397 rpm, 790 ft/s)
chord = [[0.15, 0.824], [1.0, 0.559]]   # linear: 22 in at the tip, 34.3 in extrapolated to the centre; solidity 0.105
root_cutout = 0.15
twist = [[0.15, 30.0], [0.2, 26.5], [0.3, 19.0], [0.4, 12.5], [0.5, 8.4], [0.6, 5.2], [0.7, 1.8], [0.75, 0.0],
         [0.8, -1.5], [0.9, -4.5], [1.0, -7.5]]
rotation = "ccw"             # anticlockwise seen from above ("right rotor clockwise when looking forward" in airplane mode)
hub = "teetering"            # gimballed: the blades cone by bending about the precone
precone_deg = 2.5
lock_number = 3.8
position = [0.0, -7.04, 0.0]     # hubs 46.2 ft apart
pivot = [0.306, -7.04, -1.732]   # the conversion axis: the hub 1.732 m above it and 0.306 m aft in helicopter mode
axis = [0.0, 0.0, 1.0]       # (the shafts' 2.5 deg outboard splay left out, as in the flight model)
# WRATS in hover (888 rpm, the V-22's 397 Froude scaled): coning 17.2-17.5 Hz (1.17/rev), its non-rotating 6.8 Hz
# giving 1.16/rev at 104 %; torsion 113.35 Hz cantilevered with the control chain locked, 7.4/rev at 104 % with the
# propeller moment (the flight model's 7.7/rev at 100 %). The chordwise CG and elastic axis aren't published: the
# quarter chord
coning_frequency = 1.16
torsion_frequency = 7.4
# one section for the whole blade: the flight model's XN12 at 0.75 R (the blade runs from the XN28 at 0.2 R to the XN09
# at the tip); its coordinates aren't public, so a 12 % NACA four-digit thickness. Moment -0.8 cl_i / 4
airfoil = { name = "XN12", table = "xn12_v22", thickness = 0.12, cm0 = -0.03 }
# the run-up on the ground (both rotors): the flight model's collective at 0.75 R with the lever down, which it holds while
# the rotors come up (genv22's ctl/coll-ff-deg, Bell's lever schedule [CR B-4, B-38])
flat_pitch_deg = 0.98
# its tips at flat pitch push down while its roots lift (the blade's 37.5 deg of twist): those annuli get the mirrored
# momentum balance (aero._hover_inflow), which puts the run-up's thrust where the flight model's is (T/W 0.069 at 65 %
# against its 0.060 at 66 %; clamped, 0.009, and its 100 % failed to trim)
signed_hover_inflow = true

[[rotor]]
name = "left"
role = "lift"
# the interconnect shaft holds the two rotors' blades this far out of step, measured from the recording: below the
# cockpit's lowest mode their pressures add coherently, and only here do its 1st and 2nd harmonics (16.6, 33 Hz) both
# fit (in step, the 2nd stands 12 dB over the recording's)
index_deg = 26.4
radius = 5.804
blades = 3
rpm = 412.0
chord = [[0.15, 0.824], [1.0, 0.559]]
root_cutout = 0.15
twist = [[0.15, 30.0], [0.2, 26.5], [0.3, 19.0], [0.4, 12.5], [0.5, 8.4], [0.6, 5.2], [0.7, 1.8], [0.75, 0.0],
         [0.8, -1.5], [0.9, -4.5], [1.0, -7.5]]
rotation = "cw"
hub = "teetering"
precone_deg = 2.5
lock_number = 3.8
position = [0.0, 7.04, 0.0]
pivot = [0.306, 7.04, -1.732]
axis = [0.0, 0.0, 1.0]
coning_frequency = 1.16
torsion_frequency = 7.4
airfoil = { name = "XN12", table = "xn12_v22", thickness = 0.12, cm0 = -0.03 }
signed_hover_inflow = true          # (as the right rotor's)

# Two AE 1107C (presets/engines/ae1107c.toml), one in each nacelle on the proprotor's axis, turning with it about the
# conversion axis (positions and axes nacelles vertical, as the rotors'): the inlet just below the proprotor gearbox,
# opening along the nacelle (up in helicopter mode, forward in airplane mode); the exhaust at the nacelle's far end,
# down in helicopter mode and aft in airplane mode. Positions estimated from the airframe's layout. Played by the
# flight model's engine properties; the power turbine turns with the proprotors (drive/nr-pct). The flight model has
# no starter: its engines spool up lit from rest. Measured: in airplane mode an MV-22B's cockpit recorded in cruise
# behind the pilots has no whine standing more than 2 dB out of the broadband from 6 to 8 kHz, where the model's would
# stand 11.6 dB out, while at a cabin window the model's whine stands 4.4 dB out and the recording's 3 to 5 (README,
# Checks). So the paths from the nacelles forward to the cockpit lose 18 dB the model doesn't resolve; they cross the
# proprotor's disc and slipstream, and pass the nacelle and the wing, though the turning blades alone, a tenth of the
# disc, would block far less. With the nacelles up the walls lose 13.4 dB less than the model has them losing: an MV-22B
# cockpit recorded on the ground at governed speed (refs/recordings/mv22b_cockpit2, taxi and take-off, 102-104 % NR,
# Ng 68-82 % by its whine) has its 8 kHz octave 8.2 dB under its 1 kHz (median of six moments), where the model's
# cockpit at ground idle has it 19.6 dB under, the engines its only source there; with them 13.4 dB up it is 8.2,
# and their whine stands about 3.5 dB out of its floor, as the recording's does (2 to 5). Its 4 kHz stays 5 dB
# short: another source (none attributed)
[[engine]]
name = "right"
type = "ae1107c"
pivot = [0.306, -7.04, -1.732]
inlet = [0.556, -7.04, -1.132]
inlet_axis = [0.0, 0.0, 1.0]
exhaust = [0.206, -7.04, -3.732]
exhaust_axis = [0.0, 0.0, -1.0]
properties = "/fdm/jsbsim/eng[0]"
n2_property = "/fdm/jsbsim/drive/nr-pct"
cockpit_db = [[0.0, -18.0], [90.0, 13.4]]
# What the sources miss in a start: the broadband's third octaves fitted to an MV-22B started outside
# (refs/recordings/mv22b_start: AiirSource, 2013, from in front; its spool's speed from the compressor's 32nd order),
# at 14-37 % Ng while the rotors turned slowly: the recording's floors (tones out) against the installed sound's at the
# same speed (one engine, the rotors still), each against its own 1 kHz octave, less the same difference at ground idle
# (the camera's response against the model, from 250 Hz; below it the idle's is the rotors' excess, so 250 Hz's is
# held), smoothed over a third octave either side; none at ground idle, where the two already agreed; 125 Hz held below
# (the microphone's roll-off is unknown) and 8 kHz above. Every listener: the cockpit hears it through its walls
bands_db = [[14, [[126, 5.9], [158, 7.1], [200, 9.2], [251, 10.4], [316, 11.4], [398, 11.6], [501, 9.1], [631, 6.6], [794, 1.5], [1000, -0.1], [1259, -1.5], [1585, -0.1], [1995, 4.1], [2512, 6.7], [3162, 9.7], [3981, 11.0], [5012, 11.7], [6310, 12.2], [7943, 11.3]]],
            [17, [[126, -0.3], [158, 1.0], [200, 3.3], [251, 4.2], [316, 4.8], [398, 4.6], [501, 2.4], [631, 1.1], [794, -1.6], [1000, 1.5], [1259, -1.7], [1585, -1.7], [1995, -2.3], [2512, 1.3], [3162, 4.1], [3981, 5.3], [5012, 6.0], [6310, 6.8], [7943, 6.8]]],
            [20, [[126, 1.7], [158, 3.3], [200, 5.3], [251, 5.9], [316, 6.5], [398, 6.6], [501, 4.4], [631, 3.1], [794, 0.2], [1000, 0.2], [1259, 0.6], [1585, 1.0], [1995, 3.9], [2512, 4.5], [3162, 8.5], [3981, 10.2], [5012, 12.4], [6310, 14.0], [7943, 14.8]]],
            [25, [[126, -2.2], [158, -0.0], [200, 2.4], [251, 3.8], [316, 4.0], [398, 4.3], [501, 2.6], [631, 1.2], [794, -0.5], [1000, 1.3], [1259, 0.8], [1585, 2.6], [1995, 2.8], [2512, 3.8], [3162, 2.6], [3981, 4.4], [5012, 2.6], [6310, 3.9], [7943, 2.5]]],
            [30, [[126, -1.4], [158, 0.1], [200, 2.5], [251, 2.4], [316, 2.6], [398, 3.1], [501, 2.1], [631, 0.7], [794, -1.7], [1000, 1.1], [1259, 0.9], [1585, 1.4], [1995, 0.7], [2512, 2.9], [3162, 4.7], [3981, 2.8], [5012, -0.1], [6310, 1.0], [7943, 4.3]]],
            [37, [[126, -5.3], [158, -1.2], [200, 2.8], [251, 2.9], [316, 2.4], [398, 2.8], [501, 1.8], [631, 0.8], [794, -1.0], [1000, 1.4], [1259, 0.7], [1585, 1.2], [1995, -0.3], [2512, 1.3], [3162, 2.3], [3981, 5.3], [5012, 0.1], [6310, -1.2], [7943, -4.1]]],
            [76, [[125, 0.0], [8000, 0.0]]]]

[[engine]]
name = "left"
type = "ae1107c"
pivot = [0.306, 7.04, -1.732]
inlet = [0.556, 7.04, -1.132]
