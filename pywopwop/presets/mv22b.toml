# The drive as heard in the cockpit, measured from an MV-22B's cockpit recorded in airplane-mode cruise (83.7 % rotor
# speed, about 46 % torque): the drive's and engines' vibration reaching the cabin's frames through the wing (the
# engines, proprotor gearboxes, interconnect shaft and mid-wing gearbox all sit in or on it), a steady roar strongest
# by the wing's root, with the recording's own spectrum from 40 Hz to 12 kHz (its floor between the lines), its
# level so that the proprotors' harmonics up to the 10th stand out of it as they do in the recording (the higher
# ones the model lacks: README, Checks); and two gear meshes at their recorded prominence (8.17 kHz there: 39 times the power turbine's
# shaft rate, the engine's output gear; 2.03 kHz, its shaft not identified). Played by the rotor speed and the
# engines' torque.
[transmission]
tones = [[2430.0, 65.4, 6.62], [9759.0, 48.7, 6.62]]
bands = [[47, 80.4], [60, 84.4], [74, 81.7], [94, 89.0], [118, 87.1], [149, 88.8], [188, 90.7], [237, 94.9], [299, 94.0], [376, 93.5], [474, 94.5], [597, 92.6], [753, 90.9],
         [948, 90.0], [1195, 85.9], [1505, 82.0], [1897, 79.2], [2389, 76.6], [3011, 73.3], [3793, 73.5], [4779, 69.7],
         [6021, 65.9], [7586, 65.2], [9558, 60.1], [12042, 59.6]]
reference_torque_pct = 46.0
rpm_property = "/fdm/jsbsim/drive/nr-pct"
rpm_nominal = 100.0
# in the recording the whole broadband from 500 Hz to 12 kHz swells and fades by 1 dB once a blade pass (0.8 to 1.3 dB
# peak to peak, as deep in passes with weak low pulses as with strong ones: not the camera's gain): the meshes' load
# rippling 6 % with the proprotors' torque as each blade passes the wing, at their blade-passing rate (19.85 Hz at
# 100 %)
ripple = [19.85, 0.06]
torque_properties = ["/fdm/jsbsim/eng[0]/torque-pct", "/fdm/jsbsim/eng[1]/torque-pct"]
